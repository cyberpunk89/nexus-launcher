# The unit suite on Linux (the product) and Windows (the port). Tests for one
# OS only are skipped on the other (tests/oskind.py), so a red Windows job is a
# real regression.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.14'}       # what CachyOS ships
          - {os: windows-latest, python: '3.12'}      # the Windows build's Python
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
      NEXUS_DEV_WINDOWS: '1'      # bin/ would otherwise stop with "Linux only"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Qt's system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -r requirements.txt
      # Through a file: on the Windows runner the console output of the run
      # has gone missing, and the file shows it regardless. faulthandler:
      # a native crash (exit 127, no summary) still prints where it was.
      - name: Tests
        shell: bash
        run: |
          rc=0
          python -X faulthandler -m unittest discover -s tests -v > test-output.txt 2>&1 || rc=$?
          grep -E '^(FAIL|ERROR):|^Ran |^OK|^FAILED' test-output.txt || true
          echo "::group::Full output"; cat test-output.txt; echo "::endgroup::"
          exit $rc

[[recipe]]
name = "Gamescope upscale (1440p)"
kind = "profile"
icon = "monitor"
accent = "#89b4fa"
tags = ["gamescope", "upscale", "fullscreen"]
description = "Run inside gamescope at 2560×1440 fullscreen — great for FSR/integer scaling and frame caps."
env = []

tags = ["gamescope", "borderless", "alt-tab"]
description = "Run inside gamescope borderless at native resolution — smoother alt-tab and overlay handling."
env = []
wrappers = [["gamescope", "-b"]]

[[recipe]]
name = "GameMode performance"
kind = "profile"
icon = "rocket"
accent = "#a6e3a1"
tags = ["GameMode", "CPU governor"]
description = "Apply Feral GameMode CPU governor + IO priority tuning while the game runs. Safe, universal one-click boost."
env = []
wrappers = [["gamemoderun", ""]]

# =========================== Troubleshooter =========================

[[recipe]]
name = "RE Engine: ray tracing / DLSS won't show (experimental)"
kind = "fix"
symptom = "An RE Engine game (Resident Evil, Monster Hunter) hides its ray-tracing or DLSS options on a Radeon GPU."
icon = "sparkle"
accent = "#f5c2e7"
tags = ["RE Engine", "ray tracing", "DLSS", "OptiScaler", "experimental"]
description = "Forces NVAPI on and loads a native dxgi so the engine exposes RT/DLSS, which OptiScaler then maps to FSR. Also: enable OptiScaler with GPU spoofing on, and add the game argument /WineDetectionEnabled:False in Game arguments. Full path tracing currently needs an experimental OptiScaler build."
env = [
    ["WINEDLLOVERRIDES", "dxgi=n,b"],
    ["PROTON_FORCE_NVAPI", "1"],
    ["DXVK_ENABLE_NVAPI", "1"],
]
wrappers = []

[[recipe]]
name = "Black or missing cutscenes / videos"
kind = "fix"
symptom = "Pre-rendered movies (intro/FMV) are black or absent."
icon = "film"
accent = "#f9e2af"
tags = ["video", "GStreamer"]
description = "Force GStreamer media playback, which fixes most missing-video cases."
env = [["PROTON_MEDIA_FORCE_GST", "1"]]
wrappers = []

[[recipe]]
name = "Stutter when new effects appear"
kind = "fix"
symptom = "Hitches the first time a shader/effect is used."
icon = "gauge"
accent = "#fab387"
tags = ["shader cache"]
description = "Compile shaders asynchronously with the gplasync DXVK fork and keep a per-game shader cache (NOT for anti-cheat games)."
env = [["PROTON_LOCAL_SHADER_CACHE", "1"], ["PROTON_DXVK_GPLASYNC", "1"]]
wrappers = []

[[recipe]]
name = "Anti-cheat game won't launch"
kind = "fix"
symptom = "EAC/BattlEye title closes immediately or errors."
icon = "shield"
accent = "#a6e3a1"
tags = ["EAC", "BattlEye"]
protondb_tiers = ["borked"]
description = "Ensure Proton's bundled EAC and BattlEye runtimes are enabled."
env = [["PROTON_EAC_RUNTIME", "1"], ["PROTON_BATTLEYE_RUNTIME", "1"]]
wrappers = []

[[recipe]]
name = "Game crashes at launch"
kind = "fix"
symptom = "Crashes before/at the main menu."
icon = "wrench"
accent = "#f38ba8"
tags = ["crash", "logging"]
protondb_tiers = ["borked", "bronze"]
description = "Common crash workarounds + a log to pinpoint the cause."
env = [
    ["PROTON_FORCE_LARGE_ADDRESS_AWARE", "1"],
    ["PROTON_HEAP_DELAY_FREE", "1"],
    ["PROTON_LOG", "1"],
]
wrappers = []

[[recipe]]
name = "Rendering glitches — fall back to WineD3D"
kind = "fix"
symptom = "DXVK shows artifacts, black textures or won't init."
icon = "wrench"
accent = "#fab387"
tags = ["DXVK", "fallback"]
protondb_tiers = ["borked", "bronze"]
description = "Route Direct3D through OpenGL (WineD3D) instead of DXVK as a last resort."
env = [["PROTON_USE_WINED3D", "1"]]
wrappers = []

[[recipe]]
name = "Controller not detected"
kind = "fix"
symptom = "Gamepad isn't recognized or is mis-mapped."
icon = "wrench"
accent = "#89b4fa"
tags = ["input", "SDL"]
description = "Route input through SDL instead of HIDRAW/Steam Input."

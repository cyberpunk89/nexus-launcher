# Bundled copy of protongen's recipe catalog (Proton-gui/src-tauri/recipes.toml).
# Nexus prefers ~/.config/protongen/recipes.toml when it exists. Synced: 2026-09-30 from protongen 0.24.0.
# protongen recipes — one-click option bundles.
#
#   kind = "profile"  → a curated starting point (shown under "Profiles")
#   kind = "fix"      → a troubleshooter remedy (shown under "Troubleshooter")
#
# Applying a recipe MERGES onto the current selection (enables + sets the listed
# keys; it does not disable anything you already turned on). `gpu` is an optional
# relevance hint (nvidia|amd|intel|any). `needs` is an optional list of required
# capabilities (wayland|kde|ntsync|hdr|fsr4|rdna3|rdna4) — a recipe whose needs
# aren't met is hidden by default. The last four are opt-in capabilities set in
# Settings: `hdr` from its toggle, and fsr4/rdna3/rdna4 derived from the AMD
# generation selector (`fsr4` = either generation, rdna3/rdna4 exclusive). Tag a
# recipe with the exclusive capability when it only applies to one generation —
# `fsr4` alone would leave it visible on both. env/wrappers are [key, value]
# pairs; wrapper value is "" for plain wrappers, args for gamescope.
#
# Presentation (all optional): `icon` (sparkle|lightning|rocket|monitor|gauge|
# wrench|shield|film), `accent` (hex color for the card), `tags` (chips).

# ============================= Profiles ==============================

[[recipe]]
name = "NVIDIA: DLSS + Reflex"
kind = "profile"
gpu = "nvidia"
icon = "lightning"
accent = "#76b900"
tags = ["DLSS", "Reflex", "NVAPI"]
description = "Expose NVAPI to DXVK, auto-upgrade DLSS, and enable Reflex low-latency in Vulkan/DXVK."
env = [
    ["DXVK_ENABLE_NVAPI", "1"],
    ["PROTON_DLSS_UPGRADE", "1"],
    ["DXVK_NVAPI_VKREFLEX", "1"],
]
wrappers = []

[[recipe]]
name = "AMD: FSR 4 upgrade"
kind = "profile"
gpu = "amd"
needs = ["rdna4"]
icon = "rocket"
accent = "#e0234e"
tags = ["FSR 4", "RDNA4", "frame-gen"]
description = "Auto-upgrade the game's FSR to FSR 4 with multi-frame generation (RDNA4)."
env = [
    ["PROTON_FSR4_UPGRADE", "1"],
    ["PROTON_MLFG_UPGRADE", "1"],
]
wrappers = []

[[recipe]]
name = "AMD: FSR 4 on RDNA3"
kind = "profile"
gpu = "amd"
needs = ["rdna3"]
icon = "rocket"
accent = "#e0234e"
tags = ["FSR 4", "RDNA3", "frame-gen"]
description = "FSR 4 upscaling + multi-frame generation on RDNA3 (redstone frame-gen with the RDNA3 workaround)."
env = [
    ["PROTON_FSR4_UPGRADE", "1"],
    ["PROTON_MLFG_UPGRADE", "1"],
    ["DXIL_SPIRV_CONFIG", "wmma_rdna3_workaround"],
]
wrappers = []

[[recipe]]
name = "AMD: DLSS game → FSR 4 (OptiScaler)"
kind = "profile"
gpu = "amd"
needs = ["fsr4"]
icon = "sparkle"
accent = "#e0234e"
tags = ["OptiScaler", "FSR 4", "DLSS→FSR"]
# Stays on `fsr4` rather than a generation tag: OptiScaler redirects DLSS on both
# RDNA3 and RDNA4. It deliberately does *not* set DXIL_SPIRV_CONFIG — on RDNA3 the
# rdna3-mlfg-workaround lint fires with a one-click fix, and hardcoding it here
# would put a no-op env var on every RDNA4 command instead.
description = "For games that only expose DLSS: inject OptiScaler to redirect it to FSR 4 + multi-frame generation. Single-player only — OptiScaler can trip kernel anti-cheat."
env = [
    ["PROTON_USE_OPTISCALER", "1"],
    ["PROTON_FSR4_UPGRADE", "1"],
    ["PROTON_MLFG_UPGRADE", "1"],
]
wrappers = []

[[recipe]]
name = "My RDNA4 default"
kind = "profile"
gpu = "amd"
needs = ["rdna4"]
icon = "sparkle"
accent = "#a6e3a1"
tags = ["RDNA4", "GameMode", "MangoHud"]
description = "Everyday starting point on RDNA4: GameMode + MangoHud overlay with the FSR 4 upgrade applied."
env = [["PROTON_FSR4_UPGRADE", "1"]]
wrappers = [["gamemoderun", ""], ["mangohud", ""]]

[[recipe]]
name = "HDR on Wayland"
kind = "profile"
needs = ["wayland", "hdr"]
icon = "monitor"
accent = "#f5bde6"
tags = ["HDR", "Wayland"]
